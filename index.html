*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center}
.phone{width:390px;max-width:100%;height:780px;max-height:100%;background:var(--screen-bg,var(--card));color:var(--tx);border-radius:34px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--br)}
@media(max-width:430px){.phone{border-radius:0;height:100%;border:0}}
header{padding:14px 16px 8px}.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px}header h1{font-size:18px;margin:0}header .subtitle{font-size:12px;color:var(--mut)}.lang{border:1px solid var(--br);background:var(--soft);color:var(--tx);border-radius:99px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}
main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
.scroll{overflow-y:auto;padding:4px 14px 14px}
nav{display:flex;border-top:1px solid var(--br);background:var(--card)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 10px;font:inherit;font-size:11px;cursor:pointer;position:relative}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pri);font-weight:700}
.badge{position:absolute;top:4px;left:56%;background:var(--bad);color:#fff;border-radius:99px;font-size:10px;padding:0 6px}
.mapbox{flex:1;min-height:0;background:var(--land);margin:0 10px;border-radius:16px;overflow:hidden}
.mapbox svg{width:100%;height:100%;display:block}
.sheet{padding:12px 14px 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.big{font-size:38px;font-weight:700;line-height:1}
.mut{color:var(--mut);font-size:12px}
.chip{border:1px solid var(--br);background:var(--soft);color:var(--tx);border-radius:99px;padding:4px 11px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{background:var(--tx);color:var(--card)}
.bar{height:8px;border-radius:5px;background:var(--br);overflow:hidden;flex:1}.bar i{display:block;height:100%;transition:width .5s}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;background:var(--soft);border-radius:12px;margin-bottom:8px;cursor:pointer}
.item.sel{box-shadow:inset 0 0 0 2px var(--pri)}.nm{font-weight:600}.item .bar{grid-column:1/3;margin-top:5px;flex:none}
.al{background:var(--soft);border-left:4px solid var(--warn);border-radius:12px;padding:11px 12px;margin-bottom:10px}
.al.bad{border-color:var(--bad)}.al b{display:block}.al .alt{display:none;margin-top:8px;padding:8px;background:var(--card);border-radius:8px;font-size:13px}
.al.open .alt{display:block}
.btn{border:0;background:var(--pri);color:#fff;border-radius:12px;font:inherit;padding:8px 14px;cursor:pointer}
.phone{position:relative}
.recommendation{position:absolute;top:12px;left:12px;right:12px;z-index:10;display:flex;justify-content:center;align-items:flex-start;pointer-events:none}
.recommendation[hidden]{display:none}.recommendation-card{width:100%;max-width:320px;padding:20px;background:var(--card);color:var(--tx);border:1px solid var(--br);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.3);pointer-events:auto}
.recommendation-card h2{margin:0 0 10px;font-size:18px}.recommendation-card p{margin:0 0 18px;line-height:1.5;color:var(--tx)}
.recommendation-card .btn{display:block;margin-left:auto}
.hurry{width:210px;height:210px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 10px 0 #a63a18;position:relative}
.hurry:active{transform:translateY(8px);box-shadow:0 2px 0 #a63a18}
.fl{position:absolute;left:50%;top:30%;pointer-events:none;animation:up 1.1s forwards;font-size:26px}
@keyframes up{to{transform:translate(var(--dx),-120px);opacity:0}}
.flow{stroke-dasharray:6 10;animation:fw 1.2s linear infinite}@keyframes fw{to{stroke-dashoffset:-16}}
@keyframes pu{50%{r:20;opacity:.1}}.pulse{animation:pu 2s infinite}

<nav>

</nav>

const T=[[1,"Light"],[1.3,"Moderate"],[1.7,"Heavy"]];let tr=1,sel=null;
const col=v=>v>8?"var(--ok)":v>3?"var(--warn)":"var(--bad)";
const eta=s=>Math.round(s.e);
function seatBar(v){return`<div class="bar"><i style="width:${v/20*100}%;background:${col(v)}"></i></div>`}
function drawMap(){let h="";S.forEach((s,i)=>{const ox=s.s=="r"?16:-16;
h+=`<g onclick="pick(${i})" style="cursor:pointer"><circle cx="${s.x}" cy="${s.y}" r="${i==sel?12:8}" fill="${s.closed?"var(--bad)":"var(--card)"}" stroke="${i==sel?"var(--pri)":"var(--tx)"}" stroke-width="3"/>${s.closed?`<text x="${s.x}" y="${s.y+4}" text-anchor="middle" fill="#fff" font-size="11">✖</text>`:""}<text x="${s.s=="t"?s.x:s.x+ox}" y="${s.y+(s.s=="t"?-16:4)}" text-anchor="${s.s=="t"?"middle":s.s=="r"?"start":"end"}" font-size="12" font-weight="${i==sel?700:400}" fill="var(--tx)" stroke="var(--land)" stroke-width="3" paint-order="stroke">${stopName(s)}</text></g>`});
$("stops").innerHTML=h;
drawTrams()}
function sheet(){if(sel===null){$("sheet").innerHTML=`<div class="mut">${t("selectStopPrompt")}</div>`;return}const s=S[sel];
$("sheet").innerHTML=`<div class="row sp"><b style="font-size:16px">${stopName(s)}</b><span class="mut">${s.closed?t("closed"):t("nextTram")}</span></div>
${s.closed?`<div style="margin:10px 0" class="mut">${t("closedHelp")} <b>${stopName(S[5])}</b> ${t("walk")}.</div>`:`<div class="row" style="margin:8px 0 6px;align-items:flex-end"><div class="big">${s.e<.5?(lang==="th"?"ขณะนี้":"Now"):eta(s)}</div><div style="padding-bottom:3px">${s.e<.5?t("boarding"):t("min")}<div class="mut">${t("normally",Math.round(s.norm),Math.max(0,eta(s)-Math.round(s.norm)))}</div></div></div>
<div class="row" style="margin-bottom:8px"><span class="mut">${t("freeSeats")}</span>${seatBar(s.seat)}<b style="font-size:13px">${s.seat}/20</b></div>`}
<div class="row"><span class="mut">${t("traffic")}</span><span class="chip" style="background:${["var(--ok)","var(--warn)","var(--bad)"][tr]};color:#fff;border:0;cursor:default">● ${translations[lang].trafficLevels[tr]}</span></div>
<div class="mut" style="margin-top:6px">${t("forecast")}</div>`}
function list(){$("list").innerHTML=S.map((s,i)=>`<div class="item ${i==sel?"sel":""}" onclick="pick(${i});go('map')"><span class="nm">${s.closed?"⛔ ":""}${stopName(s)}</span><b>${s.closed?t("closedList"):(s.e<.5?(lang==="th"?"ขณะนี้":"Now"):t("minArrival",eta(s)))}</b>${s.closed?"":seatBar(s.seat)}</div>`).join("")}
let recommendationTimer=null,recommendationHideTimer=null,recommendationStop=null;
function showRecommendation(stopIndex){
recommendationStop=stopIndex;
const stop=S[stopIndex],text=$("recommendationText");
if(stop.closed)text.textContent=t("recommendationClosed");
else if(!tm.some(tram=>!tram.broken))text.textContent=t("recommendationNoService");
else{
const minutes=Math.max(0,Math.round(stop.e));
text.textContent=stop.e<=15?t("recommendationWait",minutes):t("recommendationWalk",minutes)
}
$("recommendationTitle").textContent=t("recommendationTitle");
$("recommendation").hidden=false;
clearTimeout(recommendationHideTimer);
recommendationHideTimer=setTimeout(closeRecommendation,3000)
}
function scheduleRecommendation(stopIndex){
clearTimeout(recommendationTimer);
clearTimeout(recommendationHideTimer);
$("recommendation").hidden=true;
recommendationTimer=setTimeout(()=>showRecommendation(stopIndex),2000)
}
function closeRecommendation(){clearTimeout(recommendationHideTimer);$("recommendation").hidden=true}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("recommendation").hidden)closeRecommendation()});
function pick(i){sel=i;calc();drawMap();sheet();list();scheduleRecommendation(i)}
function setT(i){tr=i;calc();sheet();list()}
function go(t){if(t=="stops"){calc();list();setTimeout(()=>{const e=document.querySelector(".item.sel");e&&e.scrollIntoView({block:"center"})},0)}document.querySelectorAll(".scr").forEach(e=>e.classList.toggle("on",e.id=="s-"+t));document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t==t))}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
let n=0,lastMessage=-1;
const backgroundThemes=[
{bg:"#dff1e4",card:"#f7fff9",soft:"#edf7ef",text:"#173b26",muted:"#385644",border:"#b4d0bc",land:"#d7ebdc",primary:"#a5351a"},
{bg:"#ffedcf",card:"#fffaf1",soft:"#fff3df",text:"#49310f",muted:"#59482e",border:"#d8c6a8",land:"#f4e3c7",primary:"#a5351a"},
{bg:"#dceeff",card:"#f7fbff",soft:"#edf5fc",text:"#17344d",muted:"#3d5366",border:"#b7cee1",land:"#d4e6f5",primary:"#a5351a"},
{bg:"#e9def7",card:"#fcf9ff",soft:"#f3ecfa",text:"#332345",muted:"#4a3a5c",border:"#cbbbdc",land:"#e2d6f0",primary:"#a5351a"}
];
$("hb").onclick=()=>{n++;$("cnt").textContent=n;if(n%5==0){const theme=backgroundThemes[(n/5-1)%backgroundThemes.length],screen=document.querySelector(".phone");screen.style.setProperty("--screen-bg",theme.bg);screen.style.setProperty("--card",theme.card);screen.style.setProperty("--soft",theme.soft);screen.style.setProperty("--tx",theme.text);screen.style.setProperty("--mut",theme.muted);screen.style.setProperty("--br",theme.border);screen.style.setProperty("--land",theme.land);screen.style.setProperty("--pri",theme.primary)}const f=document.createElement("span");f.className="fl";f.textContent=["🚋","💨","⚡","🙏"][n%4];f.style.setProperty("--dx",(Math.random()*120-60)+"px");$("hb").appendChild(f);setTimeout(()=>f.remove(),1100);if(n%10==0){lastMessage=(n/10)%translations[lang].messages.length|0;$("msg").textContent=translations[lang].messages[lastMessage]}};

const route=$("route"),L=route.getTotalLength(),SIMX=18,DW=10,LOOP=24;
S.forEach(s=>{let b=0,d=1e9;for(let l=0;l<L;l+=1){const p=route.getPointAtLength(l),k=(p.x-s.x)**2+(p.y-s.y)**2;if(k<d){d=k;b=l}}s.f=b/L;const q=route.getPointAtLength(b);s.x=q.x;s.y=q.y});
const tm=Array.from({length:5},(_,i)=>({f:i/5,seats:[14,6,10,12,8][i],broken:false,id:i+1,dwell:0,at:-1}));
tm[1].broken=true;tm[1].f=S[2].f-.01;
S.forEach(s=>s.extraWait=0);
let activeAlerts=[{type:"tramBroken",tramId:2,stopIndex:2}],alertNotice=null;
let newAlertTimer=null,newAlertVisible=false;
function updateAlertCount(){
const badge=$("alertCount");
badge.textContent=newAlertVisible?"NEW":activeAlerts.length;
badge.hidden=activeAlerts.length===0&&!newAlertVisible
}
function flashNewAlert(){
clearTimeout(newAlertTimer);
newAlertVisible=true;
updateAlertCount();
newAlertTimer=setTimeout(()=>{newAlertVisible=false;updateAlertCount()},2000)
}
function renderAlerts(){
const alerts=alertNotice?[...activeAlerts,alertNotice]:activeAlerts;
updateAlertCount();
if(!alerts.length){$("alertsList").innerHTML=`<div class="al" style="border-color:var(--ok)"><b>${t("normalService")}</b><span class="mut">${t("updatedNow")}</span></div>`;return}
$("alertsList").innerHTML=alerts.map(a=>{
const place=stopName(S[a.stopIndex??2]),args=a.type.startsWith("tram")?[a.tramId,place]:[place],severity=["tramBroken","stopClosed"].includes(a.type)?" bad":"";
return`<div class="al${severity}" onclick="this.classList.toggle('open')"><b>${t(a.type+"Title",...args)}</b><span class="mut">${t(a.type+"Details")}</span><div class="mut" style="margin-top:6px">${t("tapAlternatives")}</div><div class="alt">${t(a.type+"Alternative")}</div></div>`
}).join("")
}
function updateServiceStatus(){document.querySelector('[data-i18n="subtitle"]').textContent=t("subtitle",tm.filter(t=>!t.broken).length)}
function updateStopWait(stopIndex){
const stop=S[stopIndex],previous=stop.extraWait;
stop.extraWait=activeAlerts.reduce((total,a)=>total+(a.stopIndex===stopIndex?(a.type==="delayEvent"||a.type==="trafficEvent"?15:0):0),0);
if(stop.extraWait>previous)tm.forEach(t=>{if(!t.broken&&t.dwell>0&&t.at===stopIndex)t.dwell+=stop.extraWait-previous})
}
function updateRandomAlert(){
const broken=tm.filter(t=>t.broken),closed=S.map((s,i)=>({s,i})).filter(x=>x.s.closed);
const choices=["trafficEvent","delayEvent"];
if(broken.length)choices.push("tramRestore");else choices.push("tramBreak");
if(closed.length)choices.push("stopReopen");else choices.push("stopClose");
if(activeAlerts.some(a=>a.type==="trafficEvent"))choices.push("trafficClear");
if(activeAlerts.some(a=>a.type==="delayEvent"))choices.push("delayClear");
const choice=choices[Math.floor(Math.random()*choices.length)];
alertNotice=null;
if(choice==="tramBreak"){
const tram=tm.filter(t=>!t.broken)[Math.floor(Math.random()*tm.filter(t=>!t.broken).length)],stopIndex=Math.floor(Math.random()*S.length);
tram.broken=true;tram.f=S[stopIndex].f;
activeAlerts.push({type:"tramBroken",tramId:tram.id,stopIndex});
}else if(choice==="tramRestore"){
const tram=broken[Math.floor(Math.random()*broken.length)];
tram.broken=false;
activeAlerts=activeAlerts.filter(a=>a.type!=="tramBroken"||a.tramId!==tram.id);
alertNotice={type:"tramRestored",tramId:tram.id};
}else if(choice==="stopClose"){
const candidates=S.map((s,i)=>({s,i})).filter(x=>!x.s.closed),stop=candidates[Math.floor(Math.random()*candidates.length)];
stop.s.closed=true;activeAlerts.push({type:"stopClosed",stopIndex:stop.i});
}else if(choice==="stopReopen"){
const stop=closed[Math.floor(Math.random()*closed.length)];
stop.s.closed=false;activeAlerts=activeAlerts.filter(a=>a.type!=="stopClosed"||a.stopIndex!==stop.i);
alertNotice={type:"stopReopened",stopIndex:stop.i};
}else if(choice==="trafficEvent"||choice==="delayEvent"){
const type=choice,candidates=S.map((s,i)=>({s,i})).filter(x=>!x.s.closed),stopIndex=candidates[Math.floor(Math.random()*candidates.length)].i,previous=activeAlerts.filter(a=>a.type===type);
activeAlerts=activeAlerts.filter(a=>a.type!==type);
previous.forEach(a=>updateStopWait(a.stopIndex));
activeAlerts.push({type,stopIndex});
updateStopWait(stopIndex);
}else{
const type=choice==="trafficClear"?"trafficEvent":"delayEvent",existing=activeAlerts.find(a=>a.type===type),stopIndex=existing.stopIndex;
activeAlerts=activeAlerts.filter(a=>a.type!==type);
updateStopWait(stopIndex);
alertNotice={type:choice==="trafficClear"?"trafficCleared":"delayCleared",stopIndex};
}
flashNewAlert();calc();drawMap();sheet();list();renderAlerts();updateServiceStatus()
}
function etaT(t,si,real){if(t.dwell>0&&t.at==si)return 0;const sp=real?1/T[tr][0]:1,d=((S[si].f-t.f)%1+1)%1;let wait=0;S.forEach((s,j)=>{const dj=((s.f-t.f)%1+1)%1;if(j!=si&&!s.closed&&dj>0&&dj<d)wait+=(DW+s.extraWait)*SIMX/60});return d*LOOP/sp+wait+(t.dwell>0?t.dwell*SIMX/60:0)}
function calc(){S.forEach((s,i)=>{if(s.closed)return;let b=null;tm.forEach(t=>{if(t.broken)return;const m=etaT(t,i,1);if(!b||m<b.m)b={m,t}});if(b){s.e=b.m;s.norm=etaT(b.t,i,0);s.seat=b.t.seats}})}
function drawTrams(){$("trams").innerHTML=tm.map(t=>{const p=route.getPointAtLength(t.f*L);return`<g><circle cx="${p.x}" cy="${p.y}" r="11" fill="${t.broken?"var(--mut)":"var(--pri)"}" stroke="#fff" stroke-width="2"/>${t.dwell>0?`<circle cx="${p.x}" cy="${p.y}" r="17" fill="none" stroke="var(--pri)" stroke-width="2" stroke-dasharray="4 3"/><text x="${p.x+20}" y="${p.y-12}" font-size="11" font-weight="700" fill="var(--tx)" stroke="var(--land)" stroke-width="3" paint-order="stroke">⏸ ${Math.ceil(t.dwell)}s</text>`:""}<text x="${p.x}" y="${p.y+4}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700">${t.broken?"🔧":t.id}</text></g>`}).join("")}
let dn=0, tc=0,last=performance.now(),acc=0;document.addEventListener("pointerdown",()=>dn=1);document.addEventListener("pointerup",()=>setTimeout(()=>dn=0,60));
function tick(now){const dt=Math.min((now-last)/1000,.1);last=now;acc+=dt;
tm.forEach(t=>{if(t.broken)return;if(t.dwell>0){t.dwell-=dt;if(t.dwell<=0){t.dwell=0;t.f=(t.f+1e-4)%1}return}const nf=t.f+dt*SIMX/(LOOP*60)/T[tr][0];let hit=-1,hd=2;S.forEach((s,i)=>{if(s.closed)return;const a=((s.f-t.f)%1+1)%1,b=nf-t.f;if(a>1e-5&&a<=b&&a<hd){hd=a;hit=i}});if(hit>=0){t.f=S[hit].f;t.dwell=DW+S[hit].extraWait;t.at=hit;t.seats=Math.max(0,Math.min(20,t.seats+Math.floor(Math.random()*13)-6))}else t.f=nf%1});
drawTrams();drawTrams();if(acc>1){acc=0;tc++;if(tc%12==0)tr+=tr==0?1:tr==2?-1:(Math.random()<.5?-1:1);calc();if(!dn){sheet();list()}}requestAnimationFrame(tick)}
function applyLanguage(){
document.documentElement.lang=lang;
document.title=translations[lang].pageTitle;
document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=translations[lang][e.dataset.i18n]});
$("languageToggle").textContent=lang==="en"?"ภาษาไทย":"English";
$("languageToggle").setAttribute("aria-label",lang==="en"?"Switch to Thai":"เปลี่ยนเป็นภาษาอังกฤษ");
$("roadLabel").textContent=t("roadLabel");$("directionLabel").textContent=t("directionLabel");
if(lastMessage>=0)$("msg").textContent=translations[lang].messages[lastMessage];
drawMap();sheet();list()
renderAlerts();updateServiceStatus()
if(recommendationStop!==null&&!$("recommendation").hidden)showRecommendation(recommendationStop)
}
$("languageToggle").onclick=()=>{lang=lang==="en"?"th":"en";applyLanguage()};
calc();applyLanguage();setInterval(updateRandomAlert,15000);requestAnimationFrame(tick);
</script></body></html>
